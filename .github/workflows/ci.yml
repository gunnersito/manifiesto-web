name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar pyflakes
        run: pip install pyflakes
      - name: Analizar el backend
        run: python -m pyflakes backend/app backend/crear_admin.py backend/tests

  tests:
    name: Backend (pruebas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manifiesto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/manifiesto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # numpy 2.5.4 no publica ruedas para 3.11, así que las dependencias
          # solo se instalan en 3.12 o superior.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt pytest
      - name: Ejecutar las pruebas
        working-directory: backend
        run: python -m pytest tests -q
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"

  frontend:
    name: Frontend (tipos y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Comprobar tipos
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manifiesto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/manifiesto_test
      SECRET_KEY: clave-solo-para-pruebas
      SUPABASE_URL: https://proyecto-de-pruebas.supabase.co
      SUPABASE_KEY: clave-solo-para-pruebas
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: clave-solo-para-pruebas
      CORS_ORIGINS: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias de la API
        run: pip install -r backend/requirements.txt
      - name: Arrancar la API
        run: |
          cd backend
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - name: Sembrar el manifiesto de la prueba
        run: PYTHONPATH=backend python frontend/e2e/seed_manifiesto.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Build con la API local
        working-directory: frontend
        run: npm run build
        env:
          # El proxy /api del frontend reenvía a esta URL.
          API_URL: http://localhost:8000/api
      - name: Arrancar el frontend
        working-directory: frontend
        run: |
          nohup npm start > /tmp/next.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/next.log
          exit 1
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prueba e2e
        working-directory: frontend
        run: npm run test:e2e
      - name: Logs si falla
        if: failure()
        run: |
          cat /tmp/api.log || true
          cat /tmp/next.log || true
